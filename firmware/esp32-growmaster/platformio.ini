; GrowMaster Smart-Grow ESP32 Referenz-Firmware (Protokoll v1)
; Konfiguration für PlatformIO (kompatibel mit Arduino-ESP32 Core 2.x und 3.x)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serielle Schnittstelle für Debugging
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Compiler-Optionen
; Mehr Platz für die App (TLS + JSON + Sensor-Bibliotheken), OTA bleibt möglich
board_build.partitions = min_spiffs.csv

build_flags =
    -Wall

; Externe Bibliotheken für JSON-Verarbeitung und I2C/OneWire-Sensoren
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    sensirion/arduino-sht @ ^1.2.5
    sensirion/Sensirion I2C SCD4x @ ^1.0.0
    adafruit/Adafruit MLX90614 Library @ ^2.1.5
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^3.11.0
